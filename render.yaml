services:
  # Option 1: Static Site (Recommended on Render - 100% Free, Global CDN, No spin-down delays)
  - type: web
    name: abhishek-tripathi-portfolio
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

